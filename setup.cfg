[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
branch = True
source = service

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv
ignore = E203, W503

[pylint]
max-line-length = 127
disable = C0111, C0103
